[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "school-discord-manager-e2e"
version = "0.2.0"
description = "External end-to-end test runner for School Discord Manager"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "rich>=14,<15",
]

[project.scripts]
sdm-e2e = "e2e.__main__:main"

[tool.setuptools.packages.find]
include = ["e2e*"]
